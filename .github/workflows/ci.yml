name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Offline unit suite (no network by construction)
        run: python -m pytest tests/ -q
      - name: Docs-vs-code contract linter
        run: python scripts/dev/check_docs.py
      - name: Plugin discovery adapters
        run: python scripts/dev/sync_plugin_skills.py --check
      - name: Compile every script
        run: python -m compileall -q scripts skills
